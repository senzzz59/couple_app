# 粘贴到宝塔站点 couple.senfoundry.com 的 server {} 中。
# 保留宝塔生成的 listen / server_name / SSL 证书配置。
# 网站根目录设置为 /www/wwwroot/couple.senfoundry.com。

location = /webhooks/github {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
}

# 迁移期间保留旧 URL 别名；接收器仍只接受 GitHub 的 SHA-256 签名。
location = /webhooks/gitee {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 10s;
    client_max_body_size 1m;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    # 上传照片 / 视频：视频最大 2GB；边收边转给后端，大文件不先落临时文件
    client_max_body_size 2100m;
    client_body_timeout 600s;
    proxy_request_buffering off;
}

location ^~ /files/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
}

location = /sw.js {
    add_header Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
}

location = /version.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /web-build.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ^~ /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# 替换宝塔原有的 location /，不能同时存在两段 location /。
location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html $uri/index.html /index.html;
}
