# 宝塔生产部署：仅启动 API，连接服务器现有的 MySQL couple 数据库。
# Linux host 网络允许 API 连接宿主机 127.0.0.1:3306，不创建新数据库容器。
services:
  api:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-couple}
      DB_USER: ${DB_USER:-couple}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      PORT: 8787
      HOST: 127.0.0.1
      MAX_USERS: ${MAX_USERS:-2}
      APP_TZ: ${APP_TZ:-Asia/Shanghai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
    volumes:
      - ${COUPLE_DATA_DIR:-./data}/uploads:/app/uploads
