# 宝塔生产部署：仅启动 API，连接服务器现有的 MySQL couple 数据库。
# Linux host 网络允许 API 连接宿主机 127.0.0.1:3306，不创建新数据库容器。
services:
  api:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-couple}
      DB_USER: ${DB_USER:-couple}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      UPLOAD_DIR: /app/uploads
      PORT: 8787
      HOST: 127.0.0.1
      APP_TZ: ${APP_TZ:-Asia/Shanghai}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEPLOY_NOTIFY_EMAIL: ${DEPLOY_NOTIFY_EMAIL:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
    volumes:
      - ${COUPLE_DATA_DIR:-./data}/uploads:/app/uploads
