# 安卓 App 自动更新：master 部署上线后
# - 只改了 JS / 页面：用 eas update 发布热更新到 preview 频道，已装的 App 打开时自动下载
# - 原生部分变了（runtime 指纹和 deploy/android-release.json 里的不同）：自动打新 APK，
#   把下载地址和 sha256 写回 deploy/android-release.json 并推到 master，服务器部署时下载 APK 提供下载
# 需要仓库 Secret：EXPO_TOKEN。
name: Android update

on:
  push:
    branches: [master]
    paths: ['frontend/**']
  workflow_dispatch:

concurrency:
  group: android-update
  # 不中途取消：打 APK 要二十分钟左右，取消会白打
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'senzzz59/couple_app' }}
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://couple.senfoundry.com
      EAS: npx --yes eas-cli@25.3.0
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check EXPO_TOKEN
        run: test -n "$EXPO_TOKEN" || { echo "::error::缺少仓库 Secret EXPO_TOKEN"; exit 1; }
      - run: npm ci

      - name: Wait for the server deployment
        # 先等服务器部署好这次提交（后端接口已更新），再推给 App
        run: |
          short=${GITHUB_SHA::7}
          for i in $(seq 1 60); do
            commit=$(curl -fsS https://couple.senfoundry.com/version.json | jq -r '.commit // empty' || true)
            [ "$commit" = "$short" ] && echo "Deployed: $commit" && exit 0
            [ -n "$commit" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$commit" 2>/dev/null && echo "Newer commit $commit deployed" && exit 0
            sleep 30
          done
          echo "::error::30 分钟内服务器没有部署 $short"; exit 1

      - name: Compare runtime fingerprint
        id: runtime
        run: |
          current=$(npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          released=$(jq -r '.runtime // empty' ../deploy/android-release.json 2>/dev/null || true)
          echo "current=$current released=$released"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$released" ]; then echo "native=false" >> "$GITHUB_OUTPUT"; else echo "native=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish OTA update
        if: steps.runtime.outputs.native == 'false'
        run: $EAS update --channel preview --platform android --environment preview --message "$(git log -1 --format=%s)" --non-interactive

      - name: Build a new APK
        if: steps.runtime.outputs.native == 'true'
        env:
          FINGERPRINT: ${{ steps.runtime.outputs.current }}
        run: |
          # 同一个指纹已经打过就直接用（例如上次推送回 master 失败后重跑）
          build=$($EAS build:list -p android --build-profile preview --status finished --fingerprint-hash "$FINGERPRINT" --limit 1 --json --non-interactive | jq '.[0] // empty')
          if [ -z "$build" ]; then
            build=$($EAS build -p android --profile preview --non-interactive --wait --json | jq '.[0]')
          fi
          [ "$(jq -r .status <<<"$build")" = FINISHED ] || { echo "::error::APK 构建失败"; jq . <<<"$build"; exit 1; }
          url=$(jq -r .artifacts.buildUrl <<<"$build")
          curl -fsSL "$url" -o "$RUNNER_TEMP/us.apk"
          jq -n --argjson b "$build" --arg sha "$(sha256sum "$RUNNER_TEMP/us.apk" | cut -d' ' -f1)" \
            '{version: $b.appVersion, versionCode: $b.appBuildVersion, build: $b.id, runtime: $b.runtime.version, url: $b.artifacts.buildUrl, sha256: $sha, createdAt: $b.createdAt}' \
            > ../deploy/android-release.json
          cat ../deploy/android-release.json

      - name: Push android-release.json to master
        if: steps.runtime.outputs.native == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../deploy/android-release.json
          git commit -m "安卓安装包自动更新" -m "原生部分有变化，打了新的 APK（runtime ${{ steps.runtime.outputs.current }}），服务器部署时会下载并提供下载。"
          for i in 1 2 3 4; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep $((i * 5))
          done
          exit 1
